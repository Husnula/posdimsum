<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#E03E1A"/>
      <stop offset="100%" stop-color="#991B1B"/>
    </linearGradient>
    <linearGradient id="steamerGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#F59E0B"/>
      <stop offset="100%" stop-color="#B45309"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#000" flood-opacity="0.3"/>
    </filter>
  </defs>
  <!-- Background Circle with Squircle rounded rect -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)"/>
  
  <!-- Outer subtle glow -->
  <circle cx="256" cy="256" r="180" fill="#FFF" opacity="0.08"/>

  <!-- Steamer Basket Base -->
  <g filter="url(#shadow)">
    <!-- Steam Vapors -->
    <path d="M210 160 C200 130, 225 110, 215 80" stroke="#FFF" stroke-width="8" stroke-linecap="round" fill="none" opacity="0.7"/>
    <path d="M256 150 C246 120, 270 100, 260 70" stroke="#FFF" stroke-width="10" stroke-linecap="round" fill="none" opacity="0.85"/>
    <path d="M302 160 C292 130, 315 110, 305 80" stroke="#FFF" stroke-width="8" stroke-linecap="round" fill="none" opacity="0.7"/>

    <!-- Steamer Body -->
    <path d="M120 250 L120 340 C120 380, 392 380, 392 340 L392 250 Z" fill="url(#steamerGrad)"/>
    <ellipse cx="256" cy="250" rx="136" ry="46" fill="#FDE68A"/>
    
    <!-- Dimsum Dumplings inside -->
    <!-- Dumpling 1 (Left) -->
    <g transform="translate(190, 235)">
      <ellipse cx="0" cy="5" rx="30" ry="22" fill="#FEF3C7"/>
      <path d="M-26 5 Q 0 -18 26 5" stroke="#F59E0B" stroke-width="3" fill="#FFFBEB"/>
      <!-- Chili top dot -->
      <circle cx="0" cy="-2" r="4" fill="#DC2626"/>
    </g>
    <!-- Dumpling 2 (Right) -->
    <g transform="translate(322, 235)">
      <ellipse cx="0" cy="5" rx="30" ry="22" fill="#FEF3C7"/>
      <path d="M-26 5 Q 0 -18 26 5" stroke="#F59E0B" stroke-width="3" fill="#FFFBEB"/>
      <circle cx="0" cy="-2" r="4" fill="#DC2626"/>
    </g>
    <!-- Dumpling 3 (Center Top) -->
    <g transform="translate(256, 210)">
      <ellipse cx="0" cy="6" rx="34" ry="24" fill="#FEF3C7"/>
      <path d="M-30 6 Q 0 -22 30 6" stroke="#F59E0B" stroke-width="3.5" fill="#FFFBEB"/>
      <circle cx="0" cy="-3" r="5" fill="#DC2626"/>
    </g>

    <!-- Steamer Rim Front Line -->
    <path d="M120 250 C120 295, 392 295, 392 250" stroke="#92400E" stroke-width="6" fill="none"/>
    <path d="M120 295 C120 340, 392 340, 392 295" stroke="#92400E" stroke-width="5" fill="none" opacity="0.6"/>
    <path d="M120 340 C120 385, 392 385, 392 340" stroke="#78350F" stroke-width="6" fill="none"/>
  </g>

  <!-- Brand Typography Stamp -->
  <text x="256" y="440" text-anchor="middle" font-family="system-ui, sans-serif" font-weight="800" font-size="34" fill="#FFFFFF" letter-spacing="3">TERAS FOODIES</text>
  <text x="256" y="470" text-anchor="middle" font-family="system-ui, sans-serif" font-weight="600" font-size="18" fill="#FDE68A" letter-spacing="1">POS KASIR</text>
</svg>
